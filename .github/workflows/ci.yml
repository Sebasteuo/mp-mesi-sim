name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. -DMP_USE_MOCKS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cd build
          cmake --build . -- -j 2
      - name: Smoke run
        run: |
          ./build/sim
